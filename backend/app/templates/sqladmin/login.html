<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Administrateur — E-Schola Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      background-image: 
        radial-gradient(at 0% 0%, rgba(24, 119, 242, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(37, 99, 235, 0.06) 0px, transparent 50%);
      padding: 20px;
      color: #0f172a;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    .login-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.06), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      background: #1877f2;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 10px 15px -3px rgba(24, 119, 242, 0.3);
    }

    .brand-icon svg {
      width: 28px;
      height: 28px;
      color: #ffffff;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .badge-admin {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1877f2;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-radius: 9999px;
      margin-bottom: 12px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      background: #1877f2;
      border-radius: 50%;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .brand-title span {
      color: #1877f2;
    }

    .brand-subtitle {
      font-size: 13px;
      color: #64748b;
      line-height: 1.4;
    }

    .error-alert {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-control {
      width: 100%;
      height: 46px;
      padding: 10px 14px;
      font-size: 14px;
      color: #0f172a;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      outline: none;
      transition: all 0.15s ease-in-out;
    }

    .form-control:focus {
      border-color: #1877f2;
      box-shadow: 0 0 0 3px rgba(24, 119, 242, 0.15);
    }

    .form-control::placeholder {
      color: #94a3b8;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .toggle-password:hover {
      color: #1877f2;
    }

    .btn-submit {
      width: 100%;
      height: 48px;
      background: #1877f2;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 10px 15px -3px rgba(24, 119, 242, 0.25);
      transition: all 0.15s ease-in-out;
      margin-top: 26px;
    }

    .btn-submit:hover {
      background: #166fe5;
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .footer-links {
      text-align: center;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #f1f5f9;
    }

    .back-link {
      font-size: 13px;
      color: #64748b;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s;
    }

    .back-link:hover {
      color: #1877f2;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      
      <!-- Brand Header -->
      <div class="brand-header">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <div>
          <div class="badge-admin">
            <span class="badge-dot"></span>
            <span>Portail Administrateur</span>
          </div>
          <h1 class="brand-title">E-Schola <span>Pro</span></h1>
          <p class="brand-subtitle">Gestion sécurisée de la base de données & du système</p>
        </div>
      </div>

      <!-- Error Alert -->
      {% if error %}
      <div class="error-alert">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>Identifiants administrateur incorrects ou droits insuffisants.</span>
      </div>
      {% endif %}

      <!-- Login Form -->
      <form action="{{ url_for('admin:login') }}" method="POST" autocomplete="off">
        
        <div class="form-group">
          <label class="form-label" for="username">Email ou Identifiant Admin</label>
          <input 
            id="username"
            name="username" 
            type="text" 
            class="form-control" 
            placeholder="admin@eschola.pro ou admin" 
            required 
            autofocus
            autocomplete="off"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Mot de Passe</label>
          <div class="input-wrapper">
            <input 
              id="password"
              name="password" 
              type="password" 
              class="form-control" 
              placeholder="••••••••" 
              required
              autocomplete="off"
            />
            <button type="button" class="toggle-password" id="togglePasswordBtn" title="Afficher/Masquer le mot de passe">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit">
          <span>Se Connecter à l'Administration</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <!-- Back to site -->
      <div class="footer-links">
        <a href="/" class="back-link">← Retour à la plateforme E-Schola Pro</a>
      </div>

    </div>
  </div>

  <script>
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    toggleBtn.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      } else {
        passwordInput.type = 'password';
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    });
  </script>

</body>
</html>
