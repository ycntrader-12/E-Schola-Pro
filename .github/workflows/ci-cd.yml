name: CI/CD Pipeline - E-Schola Pro

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      deploy_to_railway:
        description: "Forcer le déploiement sur Railway"
        required: false
        default: true
        type: boolean

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. QUALITÉ DU CODE & TESTS AUTOMATISÉS (BACKEND & FRONTEND)
  # =========================================================================
  test-and-lint:
    name: "Tests & Vérifications Industrielles"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ENVIRONMENT: "testing"
      AUTO_SYNC_SCHEMA: "false"
      SEED_DEMO_DATA: "false"
      SECRET_KEY: "ci_pipeline_temporary_secret_key_32bytes_long_ok"
      EMAILS_ENABLED: "false"
      SMTP_HOST: ""
      EMAIL_VALIDATE_MX: "true"
      BLOCK_DISPOSABLE_EMAILS: "true"

    steps:
      - name: "Checkout du référentiel Git"
        uses: actions/checkout@v4

      # --- BACKEND PYTHON FASTAPI ---
      - name: "Configuration de Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: "Installation des dépendances Backend"
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: "Vérification de la syntaxe Python (Linters)"
        run: |
          python -m py_compile backend/app/main.py
          python -m py_compile backend/app/core/config.py
          python -m py_compile backend/app/services/email_service.py
          python -m py_compile backend/app/api/v1/email.py

      - name: "Vérification DevOps Pré-vol (Pre-flight Checks)"
        run: |
          python backend/verify_production_env.py --ci-mode

      - name: "Exécution de la suite de tests Emails Transactionnels"
        run: |
          python backend/test_transactional_email_suite.py

      # --- FRONTEND NEXT.JS ---
      - name: "Configuration de Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: "Installation des dépendances Frontend"
        run: |
          cd frontend
          npm ci --prefer-offline || npm install --legacy-peer-deps

      - name: "Vérification du Build Frontend Next.js"
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_ENV: "production"
        run: |
          cd frontend
          npm run build

  # =========================================================================
  # 2. DÉPLOIEMENT CONTINU SUR RAILWAY
  # =========================================================================
  deploy-to-railway:
    name: "Déploiement Continu sur Railway"
    needs: test-and-lint
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_to_railway == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Checkout du référentiel Git"
        uses: actions/checkout@v4

      - name: "Vérification du secret RAILWAY_TOKEN"
        run: |
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "::warning title=Railway Token Absente::Le secret 'RAILWAY_TOKEN' n'est pas configuré dans les GitHub Secrets."
            echo "Si votre projet Railway est déjà connecté au repo GitHub, le déploiement natif s'exécute automatiquement à chaque push."
            exit 0
          else
            echo "[OK] Secret RAILWAY_TOKEN détecté."
          fi

      - name: "Installation de la CLI Railway"
        if: secrets.RAILWAY_TOKEN != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli

      - name: "Déploiement sur Railway via CLI"
        if: secrets.RAILWAY_TOKEN != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --detach --service "${{ secrets.RAILWAY_SERVICE_NAME || 'E-Schola-Pro' }}"

      - name: "Vérification post-déploiement du Healthcheck"
        if: secrets.RAILWAY_TOKEN != ''
        run: |
          TARGET_HOST="${{ secrets.RAILWAY_PUBLIC_DOMAIN || 'e-schola-pro-production.up.railway.app' }}"
          echo "Surveillance de l'endpoint : https://$TARGET_HOST/api/v1/health"
          for i in {1..24}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$TARGET_HOST/api/v1/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Conteneur actif et base de données saine (HTTP 200) !"
              exit 0
            fi
            echo "En attente du démarrage du nouveau conteneur... (tentative $i/24 - HTTP $STATUS)"
            sleep 10
          done
          echo "::warning title=Healthcheck Timeout::Le conteneur n'a pas répondu HTTP 200 dans le délai imparti."
