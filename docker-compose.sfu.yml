version: '3.8'

services:
  sfu-media-server:
    build:
      context: .
      dockerfile: Dockerfile.mediasoup
    container_name: eschola-sfu-mediasoup-cpp
    restart: always
    environment:
      - MEDIASOUP_LISTEN_IP=0.0.0.0
      - RTC_MIN_PORT=40000
      - RTC_MAX_PORT=49999
    ports:
      - "40000-40100:40000-40100/udp"
      - "40000-40100:40000-40100/tcp"
    networks:
      - eschola-net

networks:
  eschola-net:
    external: true
